services:
  - type: web
    runtime: node
    name: cargoproof-api
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    healthCheckPath: /api/state
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: DEMO_MODE
        value: "true"
      - key: VERIFICATION_ENGINE_HOSTPORT
        fromService:
          name: cargoproof-verification-engine
          type: pserv
          property: hostport

  - type: pserv
    runtime: python
    name: cargoproof-verification-engine
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn verification_engine_service.verification_engine.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: EVIDENCE_API_HOSTPORT
        fromService:
          name: cargoproof-evidence-api
          type: pserv
          property: hostport

  - type: pserv
    runtime: python
    name: cargoproof-evidence-api
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m simulated_evidence.seed && uvicorn simulated_evidence.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7

  - type: web
    runtime: static
    name: cargoproof-dashboard
    buildCommand: printf 'window.CARGOPROOF_API_URL = "%s";\n' "$CARGOPROOF_API_URL" > frontend/config.js
    staticPublishPath: frontend
    envVars:
      - key: CARGOPROOF_API_URL
        fromService:
          name: cargoproof-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
